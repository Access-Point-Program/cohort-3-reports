<div class="mb-auto">
  <ngb-carousel [interval]="3000" [pauseOnHover]="true">
    <ng-template ngbSlide>
      <div class="picsum-img-wrapper">
        <!-- Chart 1 -->
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'bar'"
          width="700px"
          height="200px"
        >
        </canvas>
      </div>
    </ng-template>
    <ng-template ngbSlide>
      <div class="picsum-img-wrapper">
        <!-- Chart 2 -->
        <app-pie-chart></app-pie-chart>
      </div>
    </ng-template>
    <ng-template ngbSlide>
      <div class="picsum-img-wrapper">
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'line'"
          width="700px"
          height="200px"
        >
        </canvas>
      </div>
    </ng-template>
  </ngb-carousel>
</div>
