<div class="mb-auto">
  <ngb-carousel [interval]="3000" [pauseOnHover]="true">
    <ng-template ngbSlide>
      <div class="picsum-img-wrapper">
        <!-- Chart 1 <chart [input]="Simulations"> -->
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'bar'"
          width="700px"
          height="200px"
        >
        </canvas>
      </div>
    </ng-template>
    <ng-template ngbSlide>
      <div class="picsum-img-wrapper">
        <!-- Chart 2  <chart [input]="Simulations">-->
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'pie'"
          width="700px"
          height="200px"
        >
        </canvas>
      </div>
    </ng-template>
    <ng-template ngbSlide>
      <div class="picsum-img-wrapper">
        <!-- Chart 3  <chart [input]="Simulations">-->
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'line'"
          width="700px"
          height="200px"
        >
        </canvas>
      </div>
    </ng-template>
  </ngb-carousel>
</div>
