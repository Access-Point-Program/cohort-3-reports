<form >
  <div class="container ">
    <div class="col-md-4 offset-md-10  shadow p-4 bg-body-tertiary rounded" style="width:300px; height:250px">
      <div class="form-group text-secondary ">
      <label for="FormControl" class="form-label mt-4">Filters</label>
  <hr />
  <!-- "d-flex flex-row-reverse  -->
      <form ngbDropdown class="p-2.5 g-col-4 d-inline-block" >
        <button type="button" class= " btn btn-outline-secondary btn-block" style="width: 252px"  id="dropdownBasic1" ngbDropdownToggle>
          {{powersselection || "Layout Filter"}}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
          <button (click)="selections(pow)" ngbDropdownItem *ngFor="let pow of powers" [value]="pow">{{pow}}</button>
          
        </div>
      </form>
  </div>
<br>
    
      <form ngbDropdown class="p-2.5 d-inline-block ">
        <button type="button" class="btn btn-outline-secondary btn-block"  style="width: 252px" id="dropdownBasic1"  ngbDropdownToggle>
          {{rulesetselection || "Ruleset Filter"}}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
          <button (click)="selection(pow)" ngbDropdownItem *ngFor="let pow of ruleset" [value]="pow">{{pow}}</button>

        </div>
      </form> 
  </div>
</div>

</form>
