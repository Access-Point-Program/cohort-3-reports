<main class="d-flex flex-nowrap" style="height: fit-content; min-height: 100%">
  <app-sidebar
    class="col-sm-3 col-12 d-flex flex-column flex-shrink-0 p-3 text-white bg-dark sidebar sticky-top"
    style="max-width: 280px; height: 100vh"
  />

  <div class="container p-4">
    <div class="row g-4">
      <ng-container>
        <div class="col-8">
          <div class="row gy-4">
            <div class="">
              <app-carousel class="col-6" [Simulations]="Simulations" />
            </div>
            <div class="">
              <table-component [RESULTS]="Simulations" />
            </div>
          </div>
        </div>
        <div class="col-4">
          <app-menu-form
            [Layouts]="Layouts"
            [Rulesets]="Rulesets"
            (userSelections)="userSelection($event)"
            class="sticky-top"
           />
        </div>
      </ng-container>
    </div>
  </div>
</main>
