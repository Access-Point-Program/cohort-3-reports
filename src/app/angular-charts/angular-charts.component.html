<div class="charts">
    <h3>Line Chart</h3>
    <canvas baseChart width="600px" height="auto" [type]="'line'" [data]="data" ></canvas>
    <h3>Bar Chart</h3>
    <canvas baseChart width="600px" height="auto" [type]="'bar'" [data]="data" ></canvas>
    <h3>Pie Chart</h3>
    <canvas baseChart width="auto" height="auto" [type]="'pie'" [data]="data" ></canvas>
</div>
